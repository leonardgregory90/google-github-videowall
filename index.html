<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Employee Recognition Wall</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* ✅ HEADER */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 15vh;

    background: #fff;
    color: #000;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;

    z-index: 1000;
    border-bottom: 1px solid rgba(0,0,0,0.2);
  }

  .logo {
    height: 6vh;
    object-fit: contain;
  }

  .header span {
    font-size: 1.5rem;
    font-weight: bold;
  }

  /* ✅ DISPLAY AREA */
  #display {
    position: absolute;
    top: 15vh;
    left: 0;
    width: 100%;
    height: 85vh;
    overflow: hidden;
  }

  /* ✅ FLOATING MESSAGE */
  .floating-message {
    position: absolute;
    max-width: 420px;

    background: rgba(255,255,255,0.1);
    padding: 16px;
    border-radius: 14px;

    backdrop-filter: blur(8px);
    box-shadow: 0 0 20px rgba(255,255,255,0.1);

    animation: fadeDrift 8s ease-in-out forwards;
  }

  .message {
    font-size: 1.4rem;
    margin-bottom: 10px;
  }

  .meta {
    font-size: 0.9rem;
    opacity: 0.75;
  }

  /* ✅ FADE + DRIFT ANIMATION */
  @keyframes fadeDrift {
    0% {
      opacity: 0;
      transform: translate(0px, 20px);
    }
    10% {
      opacity: 1;
    }
    50% {
      transform: translate(15px, -10px);
    }
    90% {
      opacity: 1;
    }
    100% {
      opacity: 0;
      transform: translate(-10px, -30px);
    }
  }
</style>
</head>

<body>

<!-- ✅ HEADER -->
<div class="header">
  <img src="FLW_Logo_Black_RGB.png" class="logo">
  <span>Media Employee Recognition Wall</span>
</div>

<div id="display"></div>

<script>
const DATA_URL =
  "https://script.google.com/macros/s/AKfycbywPgB89xihCZL-hwhoeevHUTfNWeKkzBYjrX59fwgBvbXCNDAEus1SAAYgzGfugFq-oA/exec";

const POLL_TIME = 10000;
const MAX_MESSAGES = 8;

let recognitions = [];
let activeMessages = [];
let lastMessageIndex = -1;

/* ✅ FETCH DATA */
async function fetchData() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    recognitions = await res.json();
  } catch (e) {
    console.error("Fetch error:", e);
  }
}

/* ✅ OVERLAP CHECK */
function isOverlapping(x, y, width, height) {
  for (let msg of activeMessages) {
    if (
      x < msg.x + msg.width &&
      x + width > msg.x &&
      y < msg.y + msg.height &&
      y + height > msg.y
    ) {
      return true;
    }
  }
  return false;
}

/* ✅ SPAWN MESSAGE */
function spawnMessage() {
  if (recognitions.length === 0) return;
  if (activeMessages.length >= MAX_MESSAGES) return;

  /* ✅ Prevent repeat */
  let index;
  if (recognitions.length === 1) {
    index = 0;
  } else {
    do {
      index = Math.floor(Math.random() * recognitions.length);
    } while (index === lastMessageIndex);
  }

  lastMessageIndex = index;
  const r = recognitions[index];

  const display = document.getElementById("display");

  const div = document.createElement("div");
  div.className = "floating-message";

  div.innerHTML = `
    <div class="message">“${r.message}”</div>
    <div class="meta">
      — ${r.employee}<br>
      ${new Date(r.timestamp).toLocaleString()}
    </div>
  `;

  display.appendChild(div);

  const msgWidth = 420;
  const msgHeight = 160;

  let attempts = 0;
  let placed = false;
  let x, y;

  while (!placed && attempts < 25) {
    x = Math.random() * (display.clientWidth - msgWidth);
    y = Math.random() * (display.clientHeight - msgHeight);

    if (!isOverlapping(x, y, msgWidth, msgHeight)) {
      placed = true;
    }

    attempts++;
  }

  if (!placed) {
    div.remove();
    return;
  }

  div.style.left = x + "px";
  div.style.top = y + "px";

  const msgObj = { x, y, width: msgWidth, height: msgHeight, el: div };
  activeMessages.push(msgObj);

  setTimeout(() => {
    div.remove();
    activeMessages = activeMessages.filter(m => m.el !== div);
  }, 8000);
}

/* ✅ RANDOM BURST SPAWNER */
function startSpawner() {
  const delay = 800 + Math.random() * 2000;

  setTimeout(() => {
    const burst = Math.random() < 0.35 ? 2 + Math.floor(Math.random() * 2) : 1;

    for (let i = 0; i < burst; i++) {
      setTimeout(() => spawnMessage(), i * 250);
    }

    startSpawner();
  }, delay);
}

/* ✅ INIT */
fetchData().then(startSpawner);
setInterval(fetchData, POLL_TIME);
</script>

</body>
</html>
