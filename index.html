<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Employee Recognition Wall</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow: hidden;
  }

  /* ✅ HEADER (STACKED + CENTERED) */
  .header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 15vh;

    background: #fff;
    color: #000;

    display: flex;
    flex-direction: column; /* ✅ stack logo + text */
    align-items: center;
    justify-content: center;
    gap: 6px;

    text-align: center;

    z-index: 1000;
    border-bottom: 1px solid rgba(0,0,0,0.2);
  }

  .logo {
    height: 6vh; /* ✅ responsive size */
    object-fit: contain;
  }

  .header span {
    font-size: 1.5rem;
    font-weight: bold;
    letter-spacing: 0.5px;
  }

  /* ✅ DISPLAY AREA BELOW HEADER */
  #display {
    position: absolute;
    top: 15vh;
    left: 0;
    width: 100%;
    height: 85vh;
    overflow: hidden;
  }

  /* ✅ FLOATING MESSAGE STYLE */
  .floating-message {
    position: absolute;
    max-width: 420px;

    background: rgba(255,255,255,0.1);
    padding: 16px;
    border-radius: 14px;

    backdrop-filter: blur(8px);
    box-shadow: 0 0 20px rgba(255,255,255,0.1);

    animation: fadeInOut 7s ease forwards;
  }

  .message {
    font-size: 1.4rem;
    margin-bottom: 10px;
  }

  .meta {
    font-size: 0.9rem;
    opacity: 0.75;
  }

  /* ✅ SMOOTH FADE + SLIGHT FLOAT */
  @keyframes fadeInOut {
    0%   { opacity: 0; transform: translateY(25px); }
    10%  { opacity: 1; transform: translateY(0); }
    85%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-25px); }
  }

</style>
</head>
<body>

<!-- ✅ HEADER -->
<div class="header">
  <img src="FLW_Logo_Black_RGB.png" alt="Havas Logo" class="logo">
  <span>Media Employee Recognition Wall</span>
</div>

<div id="display"></div>

<script>
const DATA_URL =
  "https://script.google.com/macros/s/AKfycbywPgB89xihCZL-hwhoeevHUTfNWeKkzBYjrX59fwgBvbXCNDAEus1SAAYgzGfugFq-oA/exec";

const POLL_TIME = 10000;

let recognitions = [];

/* ✅ FETCH DATA */
async function fetchData() {
  try {
    const res = await fetch(DATA_URL + "?t=" + Date.now());
    const data = await res.json();
    recognitions = data;
  } catch (e) {
    console.error("Fetch error:", e);
  }
}

/* ✅ SPAWN FLOATING MESSAGE */
function spawnMessage() {
  if (recognitions.length === 0) return;

  const r = recognitions[
    Math.floor(Math.random() * recognitions.length)
  ];

  const div = document.createElement("div");
  div.className = "floating-message";

  div.innerHTML = `
    <div class="message">“${r.message}”</div>
    <div class="meta">
      — ${r.employee}<br>
      ${new Date(r.timestamp).toLocaleString()}
    </div>
  `;

  /* ✅ RANDOM POSITIONING */
  const x = Math.random() * 75; 
  const y = Math.random() * 70;

  div.style.left = x + "%";
  div.style.top = y + "%";

  document.getElementById("display").appendChild(div);

  /* ✅ AUTO REMOVE */
  setTimeout(() => {
    div.remove();
  }, 7000);
}

/* ✅ CONTINUOUS, RANDOM SPAWN LOOP */
function startSpawner() {
  const delay = 1000 + Math.random() * 2500;

  setTimeout(() => {
    spawnMessage();
    startSpawner();
  }, delay);
}

/* ✅ INIT */
fetchData().then(() => {
  startSpawner();
});

setInterval(fetchData, POLL_TIME);
</script>

</body>
</html>
